name: Update card database

# NOTE: RenderZ blocks GitHub's datacenter IPs (it returns an "Unauthorised" page to the runner), so the
# SCRAPE cannot run here - it must run from a normal home connection. The daily update therefore runs on
# your PC via tools/update_cards.bat + Task Scheduler (see SETUP_LOCAL_UPDATE.md). The schedule below is
# intentionally disabled; this workflow is kept only for manual runs that rebuild cards.json from an
# already-committed spreadsheet (the rebuild works in the cloud; only the scrape is blocked).

on:
  # schedule:                 # disabled - RenderZ returns "Unauthorised" to GitHub's IPs, so a cloud scrape finds nothing
  #   - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-scan (only useful locally; RenderZ blocks the cloud runner)"
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit the refreshed cards.json back

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          if [ -f tools/requirements-scraper.txt ]; then
            pip install --quiet -r tools/requirements-scraper.txt
          else
            pip install --quiet pandas openpyxl beautifulsoup4 lxml playwright
          fi
          # The scraper runs a headless browser; install Chromium for Playwright (harmless if unused).
          python -m playwright install --with-deps chromium || true

      - name: Update cards from RenderZ and rebuild cards.json
        env:
          RENDERZ_FULL: ${{ inputs.full && '1' || '0' }}
        run: python tools/renderz_update.py

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain docs/data/cards.json renderz_full_24.xlsx renderz_players_24.xlsx)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/cards.json
            [ -f renderz_full_24.xlsx ] && git add renderz_full_24.xlsx
            [ -f renderz_players_24.xlsx ] && git add renderz_players_24.xlsx
            git commit -m "Update card database (scheduled)"
            git push
            echo "Pushed refreshed cards.json."
          else
            echo "No changes - card database already up to date."
          fi
